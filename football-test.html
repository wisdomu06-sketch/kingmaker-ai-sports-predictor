<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingmaker API Diagnostic</title>
<style>
body {
  background: #0b1220;
  color: white;
  font-family: Arial;
  padding: 20px;
}
.card {
  background: #111f31;
  padding: 18px;
  border-radius: 12px;
}
button {
  background: #1687f8;
  color: white;
  padding: 14px;
  border: 0;
  border-radius: 8px;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #49d5e5;
}
</style>
</head>
<body>

<h2>Kingmaker AI</h2>
<h3>Historical API Diagnostic</h3>

<div class="card">
<button onclick="testAPI()">Run Diagnostic</button>
<pre id="output">Waiting...</pre>
</div>

<script>
async function testAPI() {

  const output = document.getElementById("output");

  output.textContent = "Testing SportScore...";

  try {

    const url = new URL(
      "https://sportscore.com/api/v1/fixtures/"
    );

    url.searchParams.set("sport", "football");
    url.searchParams.set("date", "2026-11-02");
    url.searchParams.set("status", "finished");
    url.searchParams.set("limit", "200");

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("HTTP error: " + response.status);
    }

    const data = await response.json();

    const matches = Array.isArray(data.matches)
      ? data.matches
      : [];

    const finished = matches.filter(
      m => String(m.status).toLowerCase() === "finished"
    );

    const withScores = finished.filter(
      m =>
        m.home_score !== null &&
        m.away_score !== null &&
        Number.isFinite(Number(m.home_score)) &&
        Number.isFinite(Number(m.away_score))
    );

    output.textContent =
      "API CONNECTION: SUCCESS\n\n" +
      "Date tested: 2026-11-02\n" +
      "API count: " + data.count + "\n" +
      "Matches received: " + matches.length + "\n" +
      "Finished matches: " + finished.length + "\n" +
      "Matches with scores: " + withScores.length +
      "\n\nFIRST MATCH:\n\n" +
      JSON.stringify(matches[0] || data, null, 2);

  } catch (error) {

    output.textContent =
      "DIAGNOSTIC FAILED:\n" + error.message;

  }
}
</script>

</body>
</html>
