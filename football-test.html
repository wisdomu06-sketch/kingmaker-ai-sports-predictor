<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingmaker Football Data Test</title>

<style>
body {
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.card {
  background: #111f31;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
}

button {
  background: #1687f8;
  color: white;
  padding: 13px 20px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
  color: #49d5e5;
}
</style>
</head>

<body>

<h2>Kingmaker AI</h2>
<h3>Historical Football Data Test</h3>

<div class="card">
  <p>Testing historical football results from SportScore.</p>
  <button onclick="runTest()">Run Data Test</button>
  <pre id="output">Waiting for test...</pre>
</div>

<script src="./football-data.js"></script>

<script>
async function runTest() {

  const output = document.getElementById("output");

  output.textContent = "Retrieving historical football results...";

  try {

    const matches =
      await KingmakerFootballData.getHistoricalFixtures(7);

    if (!matches.length) {
      output.textContent =
        "No completed matches retrieved. Check API availability.";
      return;
    }

    const teamCounts = {};

    matches.forEach(match => {
      teamCounts[match.home] =
        (teamCounts[match.home] || 0) + 1;

      teamCounts[match.away] =
        (teamCounts[match.away] || 0) + 1;
    });

    const teamName = Object.keys(teamCounts)
      .sort((a, b) => teamCounts[b] - teamCounts[a])[0];

    const stats =
      KingmakerFootballData.calculateTeamStats(
        teamName,
        matches,
        10
      );

    output.textContent =
      "HISTORICAL DATA TEST: SUCCESS\n\n" +
      "Completed matches retrieved: " + matches.length +
      "\nTeams identified: " + Object.keys(teamCounts).length +
      "\n\nSAMPLE TEAM STATISTICS\n\n" +
      JSON.stringify(stats, null, 2);

  } catch (error) {

    output.textContent =
      "TEST FAILED\n\n" + error.message;

  }
}
</script>

</body>
</html>
